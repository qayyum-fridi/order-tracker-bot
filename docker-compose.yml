services:
  order-tracker-api:
    build: .
    container_name: order-tracker-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080" # bind to localhost only — nginx on the host proxies to it
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Sqlite
      ConnectionStrings__Default: "Data Source=/data/ordertrackerbot.db"
      WhatsApp__PhoneNumberId: "${WHATSAPP_PHONE_NUMBER_ID}"
      WhatsApp__AccessToken: "${WHATSAPP_ACCESS_TOKEN}"
      WhatsApp__VerifyToken: "${WHATSAPP_VERIFY_TOKEN}"
      WhatsApp__AppSecret: "${WHATSAPP_APP_SECRET}"
      OpenAi__ApiKey: "${OPENAI_API_KEY}"
      OpenAi__Model: "${OPENAI_MODEL:-gpt-4o-mini}"
      FounderAlerts__WebhookUrl: "${FOUNDER_ALERTS_WEBHOOK_URL:-}"
      WhatsApp__ProductFlowId: "${WHATSAPP_PRODUCT_FLOW_ID:-}"
      WhatsApp__CustomerFlowId: "${WHATSAPP_CUSTOMER_FLOW_ID:-}"
      WhatsApp__OrderFlowId: "${WHATSAPP_ORDER_FLOW_ID:-}"
      WhatsApp__FlowDraftMode: "${WHATSAPP_FLOW_DRAFT_MODE:-false}"
      WhatsApp__BroadcastTemplateName: "${WHATSAPP_BROADCAST_TEMPLATE:-}"
      WhatsApp__BroadcastTemplateLanguage: "${WHATSAPP_BROADCAST_TEMPLATE_LANG:-en}"
      Billing__Enabled: "${BILLING_ENABLED:-true}"
      Billing__PaymentNumber: "${BILLING_PAYMENT_NUMBER:-}"
    volumes:
      - order-tracker-db-data:/data
    networks:
      - order-tracker-net

volumes:
  order-tracker-db-data:

networks:
  order-tracker-net:
    name: order-tracker-net
