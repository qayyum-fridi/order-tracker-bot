services:
  order-tracker-api:
    build: .
    container_name: order-tracker-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080" # bind to localhost only — nginx on the host proxies to it
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Sqlite
      ConnectionStrings__Default: "Data Source=/data/ordertrackerbot.db"
      WhatsApp__PhoneNumberId: "${WHATSAPP_PHONE_NUMBER_ID}"
      WhatsApp__AccessToken: "${WHATSAPP_ACCESS_TOKEN}"
      WhatsApp__VerifyToken: "${WHATSAPP_VERIFY_TOKEN}"
      WhatsApp__AppSecret: "${WHATSAPP_APP_SECRET}"
      OpenAi__ApiKey: "${OPENAI_API_KEY}"
      OpenAi__Model: "${OPENAI_MODEL:-gpt-4o-mini}"
      OpenAi__TranscriptionModel: "${OPENAI_TRANSCRIPTION_MODEL:-gpt-transcribe}"
      FounderAlerts__WebhookUrl: "${FOUNDER_ALERTS_WEBHOOK_URL:-}"
      WhatsApp__ProductFlowId: "${WHATSAPP_PRODUCT_FLOW_ID:-}"
      WhatsApp__CustomerFlowId: "${WHATSAPP_CUSTOMER_FLOW_ID:-}"
      WhatsApp__OrderFlowId: "${WHATSAPP_ORDER_FLOW_ID:-}"
      WhatsApp__FlowDraftMode: "${WHATSAPP_FLOW_DRAFT_MODE:-false}"
      Billing__Enabled: "${BILLING_ENABLED:-true}"
      Billing__PaymentNumber: "${BILLING_PAYMENT_NUMBER:-}"
      Backup__Enabled: "${BACKUP_ENABLED:-false}"
      Backup__FolderId: "${BACKUP_FOLDER_ID:-}"
      Backup__ClientId: "${BACKUP_CLIENT_ID:-}"
      Backup__ClientSecret: "${BACKUP_CLIENT_SECRET:-}"
      Backup__RefreshToken: "${BACKUP_REFRESH_TOKEN:-}"
      ErrorLog__Enabled: "${ERRORLOG_ENABLED:-true}"
      ErrorLog__Directory: "/data/logs"
      ErrorLog__TestToken: "${ERRORLOG_TEST_TOKEN:-}"
      ErrorLog__EmailTo: "${ERRORLOG_EMAIL_TO:-}"
      ErrorLog__SmtpUser: "${ERRORLOG_SMTP_USER:-}"
      ErrorLog__SmtpPassword: "${ERRORLOG_SMTP_PASSWORD:-}"
      Instagram__LoginMode: "${INSTAGRAM_LOGIN_MODE:-facebook}"
      Instagram__AppId: "${INSTAGRAM_APP_ID:-}"
      Instagram__AppSecret: "${INSTAGRAM_APP_SECRET:-}"
      Instagram__PublicBaseUrl: "${PUBLIC_BASE_URL:-}"
      Instagram__VerifyToken: "${INSTAGRAM_VERIFY_TOKEN:-}"
    volumes:
      - order-tracker-db-data:/data
    networks:
      - order-tracker-net

volumes:
  order-tracker-db-data:

networks:
  order-tracker-net:
    name: order-tracker-net
