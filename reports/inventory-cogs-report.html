<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory COGS Summary Report</title>
<style>
:root { --bg:#f3f4f7; --card:#fff; --tx:#2b3140; --mu:#6f7789; --bd:#e3e6ee; --hd:#1a2030; --acc:#e4572e; --alt:#f8f9fb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#10141f; --card:#1a2032; --tx:#c9cfe0; --mu:#98a0b6; --bd:#2a3150; --hd:#eef0f7; --alt:#1e2438; } }
:root[data-theme="dark"] { --bg:#10141f; --card:#1a2032; --tx:#c9cfe0; --mu:#98a0b6; --bd:#2a3150; --hd:#eef0f7; --alt:#1e2438; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width:1200px; margin:0 auto; padding:16px; }
h1 { font-size:20px; margin:4px 0 12px; color:var(--hd); }
.card { background:var(--card); border-radius:10px; padding:14px 16px; box-shadow:0 1px 2px rgba(0,0,0,.06); margin-bottom:14px; }
.filters { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mu); }
select, input { background:var(--alt); border:1px solid var(--bd); border-radius:6px; padding:8px 10px; color:var(--tx); font:inherit; min-width:0; }
.actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap; }
button { font:inherit; cursor:pointer; border-radius:7px; padding:8px 14px; border:1px solid var(--bd); background:var(--card); color:var(--tx); font-weight:500; }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
.summary { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:14px; }
.stat { background:var(--card); border-radius:10px; padding:12px 14px; border-top:3px solid var(--acc); box-shadow:0 1px 2px rgba(0,0,0,.06); }
.stat small { color:var(--mu); display:block; margin-bottom:4px; }
.stat .v { font-size:20px; font-weight:700; color:var(--hd); }
.stat .q { font-size:13px; color:var(--mu); margin-top:4px; }
.tw { overflow-x:auto; }
table { width:100%; border-collapse:collapse; min-width:1000px; }
th { background:var(--acc); color:#fff; font-size:12px; font-weight:600; text-align:left; padding:10px; white-space:nowrap; }
td { padding:10px; white-space:nowrap; border-bottom:1px solid var(--bd); }
th.n, td.n { text-align:right; }
tr.prod td:first-child { font-weight:600; color:var(--hd); }
tr.var { background:var(--alt); }
tr.var td:first-child { padding-left:34px; color:var(--mu); }
.tg { background:none; border:0; color:var(--acc); padding:0 6px 0 0; font-size:13px; }
tfoot td { font-weight:700; color:var(--hd); border-top:2px solid var(--bd); }
.empty { text-align:center; color:var(--mu); padding:24px; }
.note { color:var(--mu); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Inventory COGS Summary Report</h1>

  <section class="card">
    <div class="filters">
      <label>Start date <input type="date" id="start"></label>
      <label>End date <input type="date" id="end"></label>
      <label>Month <select id="month"></select></label>
      <label>Year <select id="year"></select></label>
      <label>Category <select id="category"></select></label>
      <label>Product <select id="product"></select></label>
      <label>Variant <select id="variant"></select></label>
    </div>
    <div class="actions">
      <button id="reset" type="button">Reset filters</button>
      <button id="csv" type="button">Export CSV</button>
      <button id="xls" type="button" class="primary">Export Excel</button>
    </div>
    <div class="note" id="period"></div>
  </section>

  <div class="summary" id="summary"></div>

  <section class="card">
    <div class="tw">
      <table>
        <thead>
          <tr>
            <th>Product</th><th>SKU</th><th>Category</th><th>Variant</th><th>Unit</th>
            <th class="n">Initial qty</th><th class="n">Initial COGS</th>
            <th class="n">Sold qty</th><th class="n">Sold COGS</th>
            <th class="n">Remaining qty</th><th class="n">Remaining COGS</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="note">Quantities are in each product's own unit. COGS = quantity × unit cost.</div>
  </section>
</div>

<script src="inventory-cogs-data.js"></script>
<script>
(function () {
  "use strict";
  const DATA = window.COGS_DATA;
  const $ = (id) => document.getElementById(id);
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const money = (x) => "Rs." + x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = (x, unit) => x.toLocaleString("en-US", { maximumFractionDigits: 2 }) + " " + unit;
  const expanded = new Set();

  // All dates in the data, to fill the year list and the default range.
  const allDates = DATA.products.flatMap(p => p.variants.flatMap(v => v.events.map(e => e.date))).sort();
  const minDate = allDates[0], maxDate = allDates[allDates.length - 1];
  const years = [...new Set(allDates.map(d => d.slice(0, 4)))];

  function fillSelect(el, items, allLabel) {
    el.innerHTML = `<option value="">${allLabel}</option>` + items.map(i => `<option value="${i.value}">${i.label}</option>`).join("");
  }

  function initFilters() {
    fillSelect($("month"), MONTHS.map((m, i) => ({ value: String(i + 1).padStart(2, "0"), label: m })), "All months");
    fillSelect($("year"), years.map(y => ({ value: y, label: y })), "All years");
    fillSelect($("category"), [...new Set(DATA.products.map(p => p.category))].map(c => ({ value: c, label: c })), "All categories");
    $("start").value = minDate;
    $("end").value = maxDate;
    refreshProducts();
    refreshVariants();
  }

  function refreshProducts() {
    const cat = $("category").value;
    const list = DATA.products.filter(p => !cat || p.category === cat);
    fillSelect($("product"), list.map(p => ({ value: p.sku, label: p.name })), "All products");
  }

  function refreshVariants() {
    const sku = $("product").value;
    const p = DATA.products.find(x => x.sku === sku);
    const list = p ? p.variants : DATA.products.filter(x => !$("category").value || x.category === $("category").value).flatMap(x => x.variants);
    const labels = [...new Set(list.map(v => v.label))];
    fillSelect($("variant"), labels.map(l => ({ value: l, label: l })), "All variants");
  }

  // Month / year override the date range: a chosen month is its first to last day; a year alone is the whole year.
  function effectiveRange() {
    let start = $("start").value || minDate;
    let end = $("end").value || maxDate;
    const y = $("year").value, m = $("month").value;
    if (m || y) {
      const yr = y || maxDate.slice(0, 4);
      const fromM = m || "01", toM = m || "12";
      const last = new Date(Number(yr), Number(toM), 0).getDate();
      start = `${yr}-${fromM}-01`;
      end = `${yr}-${toM}-${String(last).padStart(2, "0")}`;
    }
    return { start, end };
  }

  // Stock of one variant on a date range: opening = everything before start; sold = sales inside the range.
  function calc(variant, range) {
    let initial = 0, sold = 0, change = 0;
    for (const e of variant.events) {
      // Opening stock is what the shop had at the start of the range; any other event before the range adds to it too.
      if (e.type === "opening" ? e.date <= range.start : e.date < range.start) initial += e.qty;
      else if (e.date <= range.end) {
        change += e.qty;
        if (e.type === "sale") sold += -e.qty;
      }
    }
    if (initial < 0) initial = 0;
    return { initial, sold, remaining: initial + change, unitCost: variant.unitCost };
  }

  function matchingRows() {
    const cat = $("category").value, sku = $("product").value, vr = $("variant").value;
    const out = [];
    for (const p of DATA.products) {
      if (cat && p.category !== cat) continue;
      if (sku && p.sku !== sku) continue;
      const vs = p.variants.filter(v => !vr || v.label === vr);
      if (vs.length) out.push({ p, vs });
    }
    return out;
  }

  function render() {
    refreshVariants();
    const range = effectiveRange();
    $("period").textContent = `Period: ${range.start} to ${range.end}`;
    const rows = matchingRows();
    const totals = { iC: 0, sC: 0, rC: 0 };
    const qty = { initial: {}, sold: {}, remaining: {} };
    let html = "";
    for (const { p, vs } of rows) {
      const per = vs.map(v => ({ v, c: calc(v, range) }));
      const sum = (f) => per.reduce((a, x) => a + f(x.c), 0);
      const I = sum(c => c.initial), S = sum(c => c.sold), R = sum(c => c.remaining);
      const iC = sum(c => c.initial * c.unitCost), sC = sum(c => c.sold * c.unitCost), rC = sum(c => c.remaining * c.unitCost);
      totals.iC += iC; totals.sC += sC; totals.rC += rC;
      qty.initial[p.unit] = (qty.initial[p.unit] || 0) + I;
      qty.sold[p.unit] = (qty.sold[p.unit] || 0) + S;
      qty.remaining[p.unit] = (qty.remaining[p.unit] || 0) + R;
      const open = expanded.has(p.sku);
      html += `<tr class="prod">
        <td><button class="tg" data-sku="${p.sku}" aria-label="Show variants">${open ? "▾" : "▸"}</button>${p.name}</td>
        <td>${p.sku}</td><td>${p.category}</td><td>${vs.length} variant${vs.length > 1 ? "s" : ""}</td><td>${p.unit}</td>
        <td class="n">${num(I, p.unit)}</td><td class="n">${money(iC)}</td>
        <td class="n">${num(S, p.unit)}</td><td class="n">${money(sC)}</td>
        <td class="n">${num(R, p.unit)}</td><td class="n">${money(rC)}</td></tr>`;
      if (open) {
        for (const { v, c } of per) {
          html += `<tr class="var">
            <td>${v.label}</td><td>${p.sku}</td><td>${p.category}</td><td>${v.label}</td><td>${p.unit}</td>
            <td class="n">${num(c.initial, p.unit)}</td><td class="n">${money(c.initial * c.unitCost)}</td>
            <td class="n">${num(c.sold, p.unit)}</td><td class="n">${money(c.sold * c.unitCost)}</td>
            <td class="n">${num(c.remaining, p.unit)}</td><td class="n">${money(c.remaining * c.unitCost)}</td></tr>`;
        }
      }
    }
    $("rows").innerHTML = html || `<tr><td colspan="11" class="empty">No data for these filters.</td></tr>`;
    const qtyText = (o) => Object.keys(o).map(u => num(o[u], u)).join(" + ") || "—";
    $("summary").innerHTML = [
      ["Total initial COGS", money(totals.iC), qtyText(qty.initial)],
      ["Total sold COGS", money(totals.sC), qtyText(qty.sold)],
      ["Total remaining COGS", money(totals.rC), qtyText(qty.remaining)],
    ].map(([a, b, c]) => `<div class="stat"><small>${a}</small><div class="v">${b}</div><div class="q">${c}</div></div>`).join("");
    currentRows = rows;
  }

  let currentRows = [];

  // The visible table as a grid of strings, for CSV and Excel export.
  function exportGrid() {
    const range = effectiveRange();
    const head = ["Product", "SKU", "Category", "Variant", "Unit", "Initial qty", "Initial COGS", "Sold qty", "Sold COGS", "Remaining qty", "Remaining COGS"];
    const body = [];
    for (const { p, vs } of currentRows) {
      for (const v of vs) {
        const c = calc(v, range);
        body.push([p.name, p.sku, p.category, v.label, p.unit, c.initial, c.initial * c.unitCost, c.sold, c.sold * c.unitCost, c.remaining, c.remaining * c.unitCost]);
      }
    }
    return [head, ...body];
  }

  function download(name, mime, text) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  $("csv").onclick = () => {
    const csv = exportGrid().map(r => r.map(c => {
      const s = typeof c === "number" ? String(Math.round(c * 100) / 100) : String(c);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(",")).join("\r\n");
    download("inventory-cogs-report.csv", "text/csv;charset=utf-8", "﻿" + csv);
  };

  // Excel opens an HTML table saved as .xls; no library needed.
  $("xls").onclick = () => {
    const grid = exportGrid();
    const rows = grid.map((r, i) => `<tr>${r.map(c => `<${i === 0 ? "th" : "td"}>${typeof c === "number" ? (Math.round(c * 100) / 100) : esc(c)}</${i === 0 ? "th" : "td"}>`).join("")}</tr>`).join("");
    download("inventory-cogs-report.xls", "application/vnd.ms-excel", `<html><head><meta charset="utf-8"></head><body><table>${rows}</table></body></html>`);
  };

  $("reset").onclick = () => {
    ["category", "product", "variant", "month", "year"].forEach(id => $(id).value = "");
    $("start").value = minDate; $("end").value = maxDate;
    refreshProducts(); render();
  };
  $("category").onchange = () => { refreshProducts(); $("product").value = ""; render(); };
  $("product").onchange = () => { $("variant").value = ""; render(); };
  ["variant", "month", "year", "start", "end"].forEach(id => $(id).onchange = render);
  $("rows").onclick = (e) => {
    const b = e.target.closest(".tg");
    if (!b) return;
    const sku = b.dataset.sku;
    expanded.has(sku) ? expanded.delete(sku) : expanded.add(sku);
    render();
  };

  initFilters();
  render();
})();
</script>
</body>
</html>
